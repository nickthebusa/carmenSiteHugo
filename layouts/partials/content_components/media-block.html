<div class="media-block {{ .data.Params.styleName }}">
  {{ with .data.Params.heading }}
    <h3>{{ . }}</h3>
  {{ end }}
  {{ with .data.Params.images }}
    <div class="centering-div">
      <div class="row-wrap-div">
        {{ range . }}
          <div class="img-wrapper">
            <img src="{{ .image }}" alt="{{ .imageAlt }}">
          </div>
        {{ end }}
      </div>
    </div>
  {{ end }}
  {{ with .data.Content }}
    {{ . | safeHTML }}
  {{ end }}
</div>
