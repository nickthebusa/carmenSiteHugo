{{ define "main" }}

<h2>Resources</h2>

{{ range .Params.sections }}
  {{ if eq .type "list-link" }}
    <div class="card">
      <ul class="resources-list">
        {{ range .links }}
          {{ partial "content_components/list-link.html" . }}
        {{ end }}
      </ul>
    </div>
  {{ end }}
{{ end }}

{{ end }}
