{{ define "main" }}

<h2>Services</h2>

{{ partial "service-dropdown.html" . }}

<div class="pick-service-page">
  {{ range .Pages }}
  <a href="{{ .Permalink }}">
    <div class="pick-service-div">
      <div class="text">
        <h3>{{ .Title }}</h3>
        <p>{{ .Params.summary }}</p>
        <div class="bg-img">
          <img src="{{ .Params.image  }}" alt="{{ .Title }}">
        </div>
      </div>
    </div>
  </a>
  {{ end }}
</div>

{{ end }}
