{{ define "main" }}

<h2>Services</h2>

<div class="dropdown-div">
  <input type="checkbox" id="dropdown" class="dropdown" name="dropdown">
  <label for="dropdown" class="dropdown-label">
    SELECT
    <svg class="arrow" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <polyline points="19 12 12 19 5 12"></polyline>
    </svg>
  </label>
  <div class="section-dropdown">
    {{ range .Pages }}
    <a href="{{ .Permalink }}"><span>{{ .Title }}</span></a>
    {{ end }}
  </div>
</div>

<div class="pick-service-page">
  {{ range .Pages }}
  <a href="{{ .Permalink }}">
    <div class="pick-service-div">
      <div class="text">
        <h3>{{ .Title }}</h3>
        <p>{{ .Params.summary }}</p>
        <div class="bg-img">
          <img src="{{ .Params.image  }}" alt="{{ .Title }}">
        </div>
      </div>
    </div>
  </a>
  {{ end }}
</div>

{{ end }}
