backend:
  name: github
  repo: nickthebusa/carmenSiteHugo
  branch: main

media_folder: static/images
public_folder: /images

collections:
  - name: 'overlap-layout'
    label: 'Overlap Layout'
    folder: 'content/overlap-layout'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Text, name: text, widget: markdown }
      - { label: Image, name: image, widget: image }
      - { label: ImageAlt, name: imageAlt, widget: string }
      - { label: Tags, name: tags, widget: list, default: ["home"] }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }

  - name: 'text-div'
    label: 'Text Div'
    folder: 'content/text-div'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Text, name: text, widget: markdown }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }

  - name: 'image-div'
    label: 'Image Div'
    folder: 'content/image-div'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Text, name: text, widget: markdown }
      - { label: Image, name: image, widget: image }
      - { label: ImageAlt, name: imageAlt, widget: string }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }

  - name: 'card'
    label: 'Card'
    folder: 'content/card'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Text, name: text, widget: markdown }
      - { label: Image, name: image, widget: image }
      - { label: ImageAlt, name: imageAlt, widget: string }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }
