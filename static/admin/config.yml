backend:
  name: github
  repo: nickthebusa/carmenSiteHugo
  branch: main
media_folder: static/images
public_folder: /images

collections:
  - name: 'settings'
    label: 'Site Settings'
    files:
      - name: 'general'
        label: 'General Settings'
        file: 'data/settings.toml'
        fields:
          - { label: Site Title, name: title, widget: string }
          - { label: Logo, name: logo, widget: image }

  - name: 'overlap-layout'
    label: 'Overlap Layout'
    folder: 'content/overlap-layout'
    create: true
    slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }
      - { label: Image, name: image, widget: image }
      - { label: Image Alt, name: imageAlt, widget: string }
      - { label: Layout,
          name: layout,
          widget: select,
          options: ["left", "right"],
          default: "left"
        }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }

  - name: 'text-div'
    label: 'Text Div'
    folder: 'content/text-div'
    create: true
    slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }

  - name: 'image-div'
    label: 'Image Div'
    folder: 'content/image-div'
    create: true
    slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Text, name: text, widget: markdown }
      - { label: Image, name: image, widget: image }
      - { label: Image Alt, name: imageAlt, widget: string }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }

  - name: 'card'
    label: 'Card'
    folder: 'content/card'
    create: true
    slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }
      - { label: Image, name: image, widget: image }
      - { label: Image Alt, name: imageAlt, widget: string }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }

  - name: 'carousel'
    label: 'Carousel'
    folder: 'content/carousel'
    create: true
    slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
    fields:
      - { label: Title, name: title, widget: string }
      - label: Items
        name: items
        widget: list
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Image Alt, name: imageAlt, widget: string }
          - { label: Link, name: link, widget: string }

  - name: 'pages'
    label: 'Pages'
    files:
      - name: 'home'
        label: 'Home Page'
        file: 'content/pages/home.md'
        fields:
          - { label: Title, name: title, widget: string }

          # ⬇️  This is the page-builder list
          - label: Sections
            name: sections
            widget: list
            # "types" replaces "fields" — each entry is a
            # different kind of section the admin can add
            types:
              - label: 'Overlap Layout'
                name: 'overlap-layout'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'overlap-layout'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']

              - label: 'Text Div'
                name: 'text-div'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'text-div'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']

              - label: 'Image Div'
                name: 'image-div'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'image-div'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']

              - label: 'Card'
                name: 'card'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'card'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']

              - label: 'Carousel'
                name: 'carousel'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'carousel'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']
