backend:
  name: github
  repo: nickthebusa/carmenSiteHugo
  branch: main
media_folder: static/images
public_folder: /images


collections:

  - name: 'settings'
    label: 'Site Settings'
    files:
      - name: 'general'
        label: 'General Settings'
        file: 'data/settings.toml'
        fields:
          - { label: Site Title, name: title, widget: string }
          - { label: Logo, name: logo, widget: image }
          - label: Services
            name: services
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Value, name: value, widget: string }

  - name: 'overlap-layout'
    label: 'Overlap Layout'
    folder: 'content/overlap-layout'
    create: true
    slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }
      - { label: Image, name: image, widget: image }
      - { label: Image Alt, name: imageAlt, widget: string }
      - { label: Style Class, name: styleName, widget: string, required: false, hint: "Optional. Add a CSS class" }
      - { label: Layout,
          name: layout,
          widget: select,
          options: ["left", "right"],
          default: "left"
        }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }

  - name: 'text-div'
    label: 'Text Div'
    folder: 'content/text-div'
    create: true
    slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }
      - { label: Style Class, name: styleName, widget: string, required: false, hint: "Optional. Add a CSS class" }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }

  - name: 'image-div'
    label: 'Image Div'
    folder: 'content/image-div'
    create: true
    slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Image, name: image, widget: image }
      - { label: Image Alt, name: imageAlt, widget: string }
      - { label: Text, name: text, widget: markdown, required: false }
      - { label: Style Class, name: styleName, widget: string, required: false, hint: "Optional. Add a CSS class." }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }

  - name: 'card'
    label: 'Card'
    folder: 'content/card'
    create: true
    slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Image Alt, name: imageAlt, widget: string, required: false }
      - { label: Style Class, name: styleName, widget: string, required: false, hint: "Optional. Add a CSS class." }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }

  - name: 'carousel'
    label: 'Carousel'
    folder: 'content/carousel'
    create: true
    slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
    fields:
      - { label: Title, name: title, widget: string }
      - label: Items
        name: items
        widget: list
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Image Alt, name: imageAlt, widget: string }
          - { label: Link, name: link, widget: string }

  - name: 'media-block'
    label: 'Media Block'
    folder: 'content/media-block'
    create: true
    slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
    fields:
      - { label: Title, name: title, widget: string }
      - label: Images
        name: images
        widget: list
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Image Alt, name: imageAlt, widget: string }
      - { label: Body, name: body, widget: markdown }
      - { label: Style Class, name: styleName, widget: string, required: false, hint: "Optional. Add a CSS class." }

  - name: 'action-button'
    label: 'Action-Button'
    folder: 'content/action-button'
    create: true
    slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Link, name: link, widget: string }
      - { label: Style Class, name: styleName, widget: string, required: false, hint: "Optional. Add a CSS class." }
      - { label: Text, name: text, widget: string, required: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Image Alt, name: imageAlt, widget: string, required: false }

  - name: 'heading'
    label: 'Heading'
    folder: 'content/heading'
    create: true
    slug: '{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Style Class, name: styleName, widget: string, required: false, hint: "Optional. Add a CSS class." }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }

  - name: 'pages'
    label: 'Pages'
    files:
      - name: 'home'
        label: 'Home Page'
        file: 'content/pages/home.md'
        fields:
          - { label: Title, name: title, widget: string }
          - label: Sections
            name: sections
            widget: list
            types:
              - label: 'Heading'
                name: 'heading'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'heading'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']
              - label: 'Overlap Layout'
                name: 'overlap-layout'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'overlap-layout'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']
              - label: 'Text Div'
                name: 'text-div'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'text-div'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']
              - label: 'Image Div'
                name: 'image-div'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'image-div'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']
              - label: 'Card'
                name: 'card'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'card'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']
              - label: 'Carousel'
                name: 'carousel'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'carousel'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']
              - label: 'Media-Block'
                name: 'media-block'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'media-block'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']
              - label: 'Action-Button'
                name: 'action-button'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'action-button'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']

      - name: 'contact'
        label: 'Contact Page'
        file: 'content/pages/contact.md'
        fields:
          - { label: Title, name: title, widget: string }
          - label: Sections
            name: sections
            widget: list
            types:
              - label: 'Heading'
                name: 'heading'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'heading'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']
              - label: 'Card'
                name: 'card'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'card'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']
              - label: 'Text Div'
                name: 'text-div'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'text-div'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']

      - name: 'resources'
        label: 'Resources Page'
        file: 'content/pages/resources.md'
        fields:
          - { label: Title, name: title, widget: string }
          - label: Sections
            name: sections
            widget: list
            types:
              - label: 'Heading'
                name: 'heading'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'heading'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']
              - label: 'List Link Group'
                name: 'list-link'
                widget: object
                fields:
                  - { label: Title, name: title, widget: string }
                  - label: Links
                    name: links
                    widget: list
                    fields:
                      - { label: Text, name: text, widget: string }
                      - { label: URL, name: link, widget: string }

      - name: 'services-index'
        label: 'Services Page'
        file: 'content/pages/services/_index.md'
        fields:
          - { label: Title, name: title, widget: string }
          - label: Sections
            name: sections
            widget: list
            types:
              - label: 'Text Div'
                name: 'text-div'
                widget: object
                fields:
                  - label: Component
                    name: id
                    widget: relation
                    collection: 'text-div'
                    search_fields: ['title']
                    value_field: '{{slug}}'
                    display_fields: ['title']

  - name: 'service-pages'
    label: 'Service Pages'
    folder: 'content/pages/services'
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL, name: url, widget: string, default: '/services/<new-service>' }
      - { label: Build Render, name: build.render, widget: hidden, default: always }
      - { label: Service Image, name: image, widget: image }
      - { label: Summary, name: summary, widget: text }
      - label: Sections
        name: sections
        widget: list
        types:
          - label: 'Heading'
            name: 'heading'
            widget: object
            fields:
              - label: Component
                name: id
                widget: relation
                collection: 'heading'
                search_fields: ['title']
                value_field: '{{slug}}'
                display_fields: ['title']
          - label: 'Overlap Layout'
            name: 'overlap-layout'
            widget: object
            fields:
              - label: Component
                name: id
                widget: relation
                collection: 'overlap-layout'
                search_fields: ['title']
                value_field: '{{slug}}'
                display_fields: ['title']
          - label: 'Text Div'
            name: 'text-div'
            widget: object
            fields:
              - label: Component
                name: id
                widget: relation
                collection: 'text-div'
                search_fields: ['title']
                value_field: '{{slug}}'
                display_fields: ['title']
          - label: 'Image Div'
            name: 'image-div'
            widget: object
            fields:
              - label: Component
                name: id
                widget: relation
                collection: 'image-div'
                search_fields: ['title']
                value_field: '{{slug}}'
                display_fields: ['title']
          - label: 'Card'
            name: 'card'
            widget: object
            fields:
              - label: Component
                name: id
                widget: relation
                collection: 'card'
                search_fields: ['title']
                value_field: '{{slug}}'
                display_fields: ['title']
          - label: 'Carousel'
            name: 'carousel'
            widget: object
            fields:
              - label: Component
                name: id
                widget: relation
                collection: 'carousel'
                search_fields: ['title']
                value_field: '{{slug}}'
                display_fields: ['title']
          - label: 'Media-Block'
            name: 'media-block'
            widget: object
            fields:
              - label: Component
                name: id
                widget: relation
                collection: 'media-block'
                search_fields: ['title']
                value_field: '{{slug}}'
                display_fields: ['title']
          - label: 'Action-Button'
            name: 'action-button'
            widget: object
            fields:
              - label: Component
                name: id
                widget: relation
                collection: 'action-button'
                search_fields: ['title']
                value_field: '{{slug}}'
                display_fields: ['title']
