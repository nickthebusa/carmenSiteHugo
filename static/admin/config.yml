backend:
  name: github
  repo: nickthebusa/carmenSiteHugo
  branch: main
media_folder: static/images
public_folder: /images
collections:
  - name: 'settings'
    label: 'Site Settings'
    files:
      - name: 'general'
        label: 'General Settings'
        file: 'data/settings.toml'
        fields:
          - { label: Site Title, name: title, widget: string }
          - { label: Logo, name: logo, widget: image }
  - name: 'overlap-layout'
    label: 'Overlap Layout'
    folder: 'content/overlap-layout'
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }
      - { label: Image, name: image, widget: image }
      - { label: Image Alt, name: imageAlt, widget: string }
      - { label: Layout,
          name: layout,
          widget: select,
          options: ["left", "right"],
          default: "left"
        }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }
  - name: 'text-div'
    label: 'Text Div'
    folder: 'content/text-div'
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }
  - name: 'image-div'
    label: 'Image Div'
    folder: 'content/image-div'
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Text, name: text, widget: markdown }
      - { label: Image, name: image, widget: image }
      - { label: Image Alt, name: imageAlt, widget: string }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }
  - name: 'card'
    label: 'Card'
    folder: 'content/card'
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }
      - { label: Image, name: image, widget: image }
      - { label: Image Alt, name: imageAlt, widget: string }
      - { label: Weight,
          name: weight,
          widget: number,
          required: false,
          hint: "Optional. Set a number to pin this item. Lower numbers appear first."
        }
  - name: 'pages'
    label: 'Pages'
    files:
      - name: 'home'
        label: 'Home Page'
        file: 'content/pages/home.md'
        fields:
          - { label: Title, name: title, widget: string }
          - label: Sections
            name: sections
            widget: list
            fields:
              - label: Type
                name: type
                widget: select
                options: ["overlap-layout", "text-div", "card", "image-div"]
              - label: Component
                name: id
                widget: relation
                collection: overlap-layout
                search_fields: ["title"]
                value_field: "{{slug}}"
                display_fields: ["title"]
